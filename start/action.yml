name: 'Start PCAP Capture'
description: 'Starts Fluxzy or mitmproxy + packet capture for TLS-decryptable recording. Place this step before your e2e tests.'
author: 'CaseWare'

inputs:
  proxy-tool:
    description: 'Proxy tool to run. Supported values: fluxzy, mitmproxy.'
    required: false
    default: 'fluxzy'
  proxy-port:
    description: 'Port for the forward proxy.'
    required: false
    default: '8080'
  capture-dir:
    description: 'Directory to store capture artifacts (PCAP, SSLKEYLOGFILE, CA cert).'
    required: false
    default: ''
  process-name:
    description: |
      Reserved for future use. Will support best-effort process-name
      filtering via iptables owner match on Linux. Currently ignored
      on all platforms.
    required: false
    default: ''
    deprecationMessage: 'Not yet implemented — reserved for a future release.'
  mitmproxy-version:
    description: 'mitmproxy version to install via pip.'
    required: false
    default: '11.0.2'
  fluxzy-version:
    description: 'Fluxzy CLI version to install when proxy-tool=fluxzy (npm version or latest).'
    required: false
    default: 'latest'
  filter-domains:
    description: 'Comma-separated domain allowlist for mitmproxy (glob patterns OK, e.g. "*.caseware.com,*.google.com"). Only matching traffic is kept.'
    required: false
    default: ''
  filter-exclude-domains:
    description: 'Comma-separated domain denylist (glob patterns). Matching traffic is dropped.'
    required: false
    default: ''
  filter-referers:
    description: 'Comma-separated referer patterns to keep (glob patterns).'
    required: false
    default: ''
  filter-content-types:
    description: 'Comma-separated content-type prefixes to keep (e.g. "text/html,application/json").'
    required: false
    default: ''
  filter-max-body-size:
    description: 'Max response body size in bytes. Responses larger than this are dropped from the flow file (0 = no limit).'
    required: false
    default: '0'
  raw-capture:
    description: 'Also run raw packet capture (tcpdump on Linux/macOS, netsh trace on Windows) alongside the proxy capture. Default: false (proxy-only).'
    required: false
    default: 'false'
  ignore-hosts:
    description: |
      Regex of hosts to transparently tunnel without MITM interception.
      These connections pass through the proxy but are NOT TLS-intercepted,
      avoiding cert / ECONNRESET issues with CI infrastructure (NX Cloud, etc.).
      Separate multiple patterns with '|'. Uses mitmproxy --ignore-hosts.
    required: false
    default: 'cloud\.nx\.app|.*\.nx\.app|.*\.googleapis\.com|.*\.launchdarkly\.com'

outputs:
  capture-dir:
    description: 'Directory containing capture artifacts.'
    value: ${{ steps.setup-dirs.outputs.capture-dir }}
  ca-cert:
    description: 'Path to the proxy root CA certificate (PEM/CRT).'
    value: ${{ steps.setup-dirs.outputs.ca-cert }}
  proxy-url:
    description: 'HTTP(S) proxy URL for clients.'
    value: ${{ steps.setup-dirs.outputs.proxy-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup directories
      id: setup-dirs
      shell: bash
      env:
        INPUT_CAPTURE_DIR: ${{ inputs.capture-dir }}
        INPUT_PROXY_TOOL: ${{ inputs.proxy-tool }}
        INPUT_PROXY_PORT: ${{ inputs.proxy-port }}
        INPUT_FILTER_DOMAINS: ${{ inputs.filter-domains }}
        INPUT_FILTER_EXCLUDE_DOMAINS: ${{ inputs.filter-exclude-domains }}
        INPUT_FILTER_REFERERS: ${{ inputs.filter-referers }}
        INPUT_FILTER_CONTENT_TYPES: ${{ inputs.filter-content-types }}
        INPUT_FILTER_MAX_BODY_SIZE: ${{ inputs.filter-max-body-size }}
      run: |
        if [ -n "$INPUT_CAPTURE_DIR" ]; then
          CAPTURE_DIR="$INPUT_CAPTURE_DIR"
        else
          CAPTURE_DIR="${RUNNER_TEMP:-/tmp}/pcap-capture"
        fi
        mkdir -p "$CAPTURE_DIR"

        MITMPROXY_HOME="$CAPTURE_DIR/.mitmproxy"
        FLUXZY_HOME="$CAPTURE_DIR/.fluxzy"
        mkdir -p "$MITMPROXY_HOME"
        mkdir -p "$FLUXZY_HOME"

        PROXY_TOOL="$INPUT_PROXY_TOOL"
        if [ "$PROXY_TOOL" = "fluxzy" ]; then
          CA_CERT="$FLUXZY_HOME/fluxzy-ca.crt"
        else
          CA_CERT="$MITMPROXY_HOME/mitmproxy-ca-cert.pem"
        fi

        echo "capture-dir=$CAPTURE_DIR"      >> "$GITHUB_OUTPUT"
        echo "mitmproxy-home=$MITMPROXY_HOME" >> "$GITHUB_OUTPUT"
        echo "fluxzy-home=$FLUXZY_HOME" >> "$GITHUB_OUTPUT"
        echo "ca-cert=$CA_CERT" >> "$GITHUB_OUTPUT"
        echo "proxy-url=http://127.0.0.1:$INPUT_PROXY_PORT" >> "$GITHUB_OUTPUT"

        # Persist for the stop action
        echo "PCAP_CAPTURE_DIR=$CAPTURE_DIR"        >> "$GITHUB_ENV"
        echo "PCAP_MITMPROXY_HOME=$MITMPROXY_HOME"  >> "$GITHUB_ENV"
        echo "PCAP_FLUXZY_HOME=$FLUXZY_HOME" >> "$GITHUB_ENV"
        echo "PCAP_PROXY_TOOL=$PROXY_TOOL" >> "$GITHUB_ENV"
        echo "PCAP_CA_CERT=$CA_CERT" >> "$GITHUB_ENV"
        echo "PCAP_PROXY_PORT=$INPUT_PROXY_PORT" >> "$GITHUB_ENV"
        echo "PCAP_FILTER_DOMAINS=$INPUT_FILTER_DOMAINS" >> "$GITHUB_ENV"
        echo "PCAP_FILTER_EXCLUDE_DOMAINS=$INPUT_FILTER_EXCLUDE_DOMAINS" >> "$GITHUB_ENV"
        echo "PCAP_FILTER_REFERERS=$INPUT_FILTER_REFERERS" >> "$GITHUB_ENV"
        echo "PCAP_FILTER_CONTENT_TYPES=$INPUT_FILTER_CONTENT_TYPES" >> "$GITHUB_ENV"
        echo "PCAP_FILTER_MAX_BODY_SIZE=$INPUT_FILTER_MAX_BODY_SIZE" >> "$GITHUB_ENV"

    # ── Install proxy tool ──────────────────────────────────────────────
    - name: Install Fluxzy
      if: inputs.proxy-tool == 'fluxzy'
      shell: bash
      env:
        FLUXZY_VERSION: ${{ inputs.fluxzy-version }}
      run: |
        echo "::group::Installing Fluxzy CLI"
        if [ "$FLUXZY_VERSION" = "latest" ]; then
          npm install -g @fluxzy/cli
        else
          npm install -g "@fluxzy/cli@$FLUXZY_VERSION"
        fi
        fluxzy --help >/dev/null
        echo "::endgroup::"

    - name: Install mitmproxy
      if: inputs.proxy-tool == 'mitmproxy'
      shell: bash
      env:
        MITMPROXY_VERSION: ${{ inputs.mitmproxy-version }}
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
      run: |
        set -euo pipefail
        echo "::group::Installing mitmproxy $MITMPROXY_VERSION on $RUNNER_OS"

        if [ "$RUNNER_OS" = "Windows" ] && command -v py >/dev/null 2>&1; then
          PYTHON_CMD=(py -3)
        elif command -v python3 >/dev/null 2>&1; then
          PYTHON_CMD=(python3)
        elif command -v python >/dev/null 2>&1; then
          PYTHON_CMD=(python)
        else
          echo "::error::python is required to install mitmproxy"
          exit 1
        fi

        MITM_VENV="$CAPTURE_DIR/.mitmproxy-venv"
        "${PYTHON_CMD[@]}" -m venv "$MITM_VENV"

        if [ "$RUNNER_OS" = "Windows" ]; then
          VENV_BIN="$MITM_VENV/Scripts"
          VENV_PY="$VENV_BIN/python.exe"
        else
          VENV_BIN="$MITM_VENV/bin"
          VENV_PY="$VENV_BIN/python"
        fi

        "$VENV_PY" -m pip install --upgrade pip
        "$VENV_PY" -m pip install "mitmproxy==$MITMPROXY_VERSION"

        echo "$VENV_BIN" >> "$GITHUB_PATH"
        export PATH="$VENV_BIN:$PATH"

        mitmdump --version
        echo "::endgroup::"

    # ── Generate CA and install it as trusted ──────────────────────────
    - name: Generate mitmproxy CA
      if: inputs.proxy-tool == 'mitmproxy'
      shell: bash
      env:
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
      run: |
        CONFDIR="$MITMPROXY_HOME"
        if [ ! -f "$CONFDIR/mitmproxy-ca-cert.pem" ]; then
          echo "Generating mitmproxy CA certificate..."
          mitmdump --set confdir="$CONFDIR" --no-server -q &
          PID=$!
          for i in $(seq 1 10); do
            if [ -f "$CONFDIR/mitmproxy-ca-cert.pem" ]; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
        fi
        if [ ! -f "$CONFDIR/mitmproxy-ca-cert.pem" ]; then
          echo "::error::CA certificate was not generated"
          exit 1
        fi
        echo "CA certificate: $CONFDIR/mitmproxy-ca-cert.pem"
        openssl x509 -in "$CONFDIR/mitmproxy-ca-cert.pem" -noout -subject -dates

    - name: Generate Fluxzy CA
      if: inputs.proxy-tool == 'fluxzy'
      shell: bash
      env:
        FLUXZY_HOME: ${{ steps.setup-dirs.outputs.fluxzy-home }}
      run: |
        CERT_PATH="$FLUXZY_HOME/fluxzy-ca.crt"
        npx --yes @fluxzy/cli cert export "$CERT_PATH"
        if ! openssl x509 -in "$CERT_PATH" -noout -subject -dates >/dev/null 2>&1; then
          if openssl x509 -inform DER -in "$CERT_PATH" -out "$CERT_PATH.pem" >/dev/null 2>&1; then
            mv "$CERT_PATH.pem" "$CERT_PATH"
          fi
        fi
        openssl x509 -in "$CERT_PATH" -noout -subject -dates

    - name: Trust CA (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        PROXY_CA_CERT: ${{ steps.setup-dirs.outputs.ca-cert }}
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo cp "$PROXY_CA_CERT" \
            /usr/local/share/ca-certificates/mitmproxy-ca.crt
          sudo update-ca-certificates
        else
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$PROXY_CA_CERT"
        fi

    - name: Trust CA (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PROXY_CA_CERT: ${{ steps.setup-dirs.outputs.ca-cert }}
      run: |
        $certPath = $env:PROXY_CA_CERT
        Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\LocalMachine\Root

    - name: Prepare Fluxzy rules
      if: inputs.proxy-tool == 'fluxzy'
      shell: bash
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        INPUT_FILTER_DOMAINS: ${{ inputs.filter-domains }}
        INPUT_FILTER_EXCLUDE_DOMAINS: ${{ inputs.filter-exclude-domains }}
      run: |
        set -euo pipefail
        RULE_FILE="$CAPTURE_DIR/fluxzy-rules.yml"

        if [ "$RUNNER_OS" = "Windows" ] && command -v py >/dev/null 2>&1; then
          PYTHON_CMD=(py -3)
        elif command -v python3 >/dev/null 2>&1; then
          PYTHON_CMD=(python3)
        elif command -v python >/dev/null 2>&1; then
          PYTHON_CMD=(python)
        else
          echo "::error::python is required to generate Fluxzy rule file"
          exit 1
        fi

        "${PYTHON_CMD[@]}" - "$RULE_FILE" "$INPUT_FILTER_DOMAINS" "$INPUT_FILTER_EXCLUDE_DOMAINS" <<'PY'
        import re
        import sys

        rule_file, allow_csv, deny_csv = sys.argv[1:4]

        def parse_csv(value: str):
          return [x.strip() for x in value.split(",") if x.strip()]

        def glob_to_regex(pattern: str) -> str:
          escaped = re.escape(pattern)
          escaped = escaped.replace(r"\*", ".*").replace(r"\?", ".")
          return f"^{escaped}$"

        allow = parse_csv(allow_csv)
        deny = parse_csv(deny_csv)

        if not allow and not deny:
          sys.exit(0)

        lines = ["rules:"]

        if deny:
          lines.append("  - filter:")
          lines.append("      typeKind: FilterCollection")
          lines.append("      operation: Or")
          lines.append("      children:")
          for d in deny:
            lines.append("        - typeKind: HostFilter")
            lines.append(f"          pattern: {glob_to_regex(d)}")
            lines.append("          operation: regex")
          lines.append("    actions:")
          lines.append("      - typeKind: AbortAction")

        if allow:
          lines.append("  - filter:")
          lines.append("      typeKind: FilterCollection")
          lines.append("      operation: Or")
          lines.append("      inverted: true")
          lines.append("      children:")
          for a in allow:
            lines.append("        - typeKind: HostFilter")
            lines.append(f"          pattern: {glob_to_regex(a)}")
            lines.append("          operation: regex")
          lines.append("    actions:")
          lines.append("      - typeKind: AbortAction")

        with open(rule_file, "w", encoding="utf-8") as f:
          f.write("\n".join(lines) + "\n")
        PY

        if [ -f "$RULE_FILE" ]; then
          echo "PCAP_FLUXZY_RULE_FILE=$RULE_FILE" >> "$GITHUB_ENV"
          echo "Fluxzy rules enabled: $RULE_FILE"
        else
          echo "PCAP_FLUXZY_RULE_FILE=" >> "$GITHUB_ENV"
        fi

    # ── Start packet capture (opt-in) ──────────────────────────────────
    - name: Start tcpdump (Unix)
      if: runner.os != 'Windows' && inputs.raw-capture == 'true'
      shell: bash
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
      run: |
        echo "::group::Starting tcpdump"
        if [ "$RUNNER_OS" = "Linux" ]; then
          IFACE="any"
        else
          IFACE="$(route -n get default 2>/dev/null | awk '/interface:/{print $2;exit}')"
          if [ -z "$IFACE" ]; then
            IFACE="en0"
          fi
        fi
        sudo bash -c "tcpdump -i '$IFACE' -w '$CAPTURE_DIR/raw-capture.pcap' -U tcp &
          echo \$! > '$CAPTURE_DIR/tcpdump.pid'"
        sleep 1
        echo "tcpdump interface: $IFACE ($RUNNER_OS)"
        echo "tcpdump PID: $(cat "$CAPTURE_DIR/tcpdump.pid")"
        echo "::endgroup::"

    - name: Start packet capture (Windows)
      if: runner.os == 'Windows' && inputs.raw-capture == 'true'
      shell: pwsh
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
      run: |
        Write-Host "::group::Starting netsh trace"
        $traceFile = Join-Path $env:CAPTURE_DIR "raw-capture.etl"
        netsh trace start capture=yes tracefile=$traceFile maxSize=512 overwrite=yes
        Write-Host "::endgroup::"

    # ── Start selected proxy tool ───────────────────────────────────────
    - name: Start Fluxzy
      if: inputs.proxy-tool == 'fluxzy'
      shell: bash
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PCAP_FLUXZY_RULE_FILE: ${{ env.PCAP_FLUXZY_RULE_FILE }}
      run: |
        set -euo pipefail
        echo "::group::Starting fluxzy on port $PROXY_PORT"
        export SSLKEYLOGFILE="$CAPTURE_DIR/sslkeys.log"

        if [ "$RUNNER_OS" = "Windows" ]; then
          FLUXZY_BIN="fluxzy.cmd"
        else
          FLUXZY_BIN="fluxzy"
        fi

        FLUXZY_ARGS=(
          start
          -l "127.0.0.1:$PROXY_PORT"
          -k
          -o "$CAPTURE_DIR/capture.har"
        )

        if [ -n "$PCAP_FLUXZY_RULE_FILE" ] && [ -f "$PCAP_FLUXZY_RULE_FILE" ]; then
          FLUXZY_ARGS+=(-r "$PCAP_FLUXZY_RULE_FILE")
        fi

        "$FLUXZY_BIN" "${FLUXZY_ARGS[@]}" > "$CAPTURE_DIR/fluxzy-stdout.log" 2>&1 &
        FLUXZY_PID=$!
        echo "$FLUXZY_PID" > "$CAPTURE_DIR/fluxzy.pid"
        echo "fluxzy PID: $FLUXZY_PID"

        if [ "$RUNNER_OS" = "Windows" ] && command -v py >/dev/null 2>&1; then
          PYTHON_CMD=(py -3)
        elif command -v python3 >/dev/null 2>&1; then
          PYTHON_CMD=(python3)
        elif command -v python >/dev/null 2>&1; then
          PYTHON_CMD=(python)
        else
          echo "::error::python is required for proxy readiness checks"
          exit 1
        fi

        READY=false
        for i in $(seq 1 30); do
          if ! kill -0 "$FLUXZY_PID" 2>/dev/null; then
            echo "::warning::fluxzy (PID $FLUXZY_PID) exited early"
            cat "$CAPTURE_DIR/fluxzy-stdout.log" 2>/dev/null || true
            break
          fi

          if "${PYTHON_CMD[@]}" -c 'import socket,sys; port=int(sys.argv[1]); s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(0.25); ok=(s.connect_ex(("127.0.0.1",port))==0); s.close(); raise SystemExit(0 if ok else 1)' "$PROXY_PORT"
          then
            echo "fluxzy is ready (iteration $i)"
            READY=true
            break
          fi
          sleep 1
        done

        if [ "$READY" = "true" ]; then
          echo "PCAP_PROXY_READY=true" >> "$GITHUB_ENV"
        else
          echo "::warning::fluxzy readiness check timed out"
          cat "$CAPTURE_DIR/fluxzy-stdout.log" 2>/dev/null || true
          echo "PCAP_PROXY_READY=false" >> "$GITHUB_ENV"
        fi
        echo "::endgroup::"

    - name: Prepare mitmproxy options
      if: inputs.proxy-tool == 'mitmproxy'
      shell: bash
      env:
        PCAP_IGNORE_HOSTS: ${{ inputs.ignore-hosts }}
      run: |
        ACTION_DIR="${GITHUB_ACTION_PATH:-.}"
        ADDON_PATH="$ACTION_DIR/../scripts/filter-addon.py"
        if [ ! -f "$ADDON_PATH" ]; then
          ADDON_PATH="$(cd "$(dirname "$0")/../scripts" 2>/dev/null && pwd)/filter-addon.py"
        fi

        if [ -f "$ADDON_PATH" ]; then
          echo "PCAP_MITM_ADDON_PATH=$ADDON_PATH" >> "$GITHUB_ENV"
          echo "Filter addon: $ADDON_PATH"
        else
          echo "PCAP_MITM_ADDON_PATH=" >> "$GITHUB_ENV"
          echo "::warning::Filter addon not found at $ADDON_PATH"
        fi

        if [ -n "$PCAP_IGNORE_HOSTS" ]; then
          echo "PCAP_MITM_IGNORE_HOSTS=$PCAP_IGNORE_HOSTS" >> "$GITHUB_ENV"
          echo "Ignore hosts (transparent tunnel): $PCAP_IGNORE_HOSTS"
        else
          echo "PCAP_MITM_IGNORE_HOSTS=" >> "$GITHUB_ENV"
        fi

    - name: Start mitmproxy
      if: inputs.proxy-tool == 'mitmproxy'
      shell: bash
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PCAP_MITM_ADDON_PATH: ${{ env.PCAP_MITM_ADDON_PATH }}
        PCAP_MITM_IGNORE_HOSTS: ${{ env.PCAP_MITM_IGNORE_HOSTS }}
      run: |
        set -euo pipefail
        echo "::group::Starting mitmdump on port $PROXY_PORT"
        export SSLKEYLOGFILE="$CAPTURE_DIR/sslkeys.log"

        if [ "$RUNNER_OS" = "Windows" ] && command -v py >/dev/null 2>&1; then
          PYTHON_CMD=(py -3)
        elif command -v python3 >/dev/null 2>&1; then
          PYTHON_CMD=(python3)
        elif command -v python >/dev/null 2>&1; then
          PYTHON_CMD=(python)
        else
          echo "::error::python is required for proxy readiness checks"
          exit 1
        fi

        MITM_ARGS=(
          --mode regular
          --listen-port "$PROXY_PORT"
          --set "confdir=$MITMPROXY_HOME"
          --set "ssl_insecure=true"
          --set "hardump=$CAPTURE_DIR/capture.har"
          --quiet
        )

        if [ -n "$PCAP_MITM_ADDON_PATH" ] && [ -f "$PCAP_MITM_ADDON_PATH" ]; then
          MITM_ARGS+=(--scripts "$PCAP_MITM_ADDON_PATH")
        fi
        if [ -n "$PCAP_MITM_IGNORE_HOSTS" ]; then
          MITM_ARGS+=(--ignore-hosts "$PCAP_MITM_IGNORE_HOSTS")
        fi

        mitmdump "${MITM_ARGS[@]}" > "$CAPTURE_DIR/mitmdump-stdout.log" 2>&1 &
        MITM_PID=$!
        echo "$MITM_PID" > "$CAPTURE_DIR/mitmdump.pid"
        echo "mitmdump PID: $MITM_PID"

        READY=false
        for i in $(seq 1 30); do
          if ! kill -0 "$MITM_PID" 2>/dev/null; then
            echo "::warning::mitmdump (PID $MITM_PID) exited early"
            cat "$CAPTURE_DIR/mitmdump-stdout.log" 2>/dev/null || true
            break
          fi

          if "${PYTHON_CMD[@]}" -c 'import socket,sys; port=int(sys.argv[1]); s=socket.socket(socket.AF_INET,socket.SOCK_STREAM); s.settimeout(0.25); ok=(s.connect_ex(("127.0.0.1",port))==0); s.close(); raise SystemExit(0 if ok else 1)' "$PROXY_PORT"
          then
            echo "mitmproxy is ready (iteration $i)"
            READY=true
            break
          fi
          sleep 1
        done

        if [ "$READY" = "true" ]; then
          echo "PCAP_PROXY_READY=true" >> "$GITHUB_ENV"
        else
          echo "::warning::mitmproxy readiness check timed out"
          cat "$CAPTURE_DIR/mitmdump-stdout.log" 2>/dev/null || true
          echo "PCAP_PROXY_READY=false" >> "$GITHUB_ENV"
        fi
        echo "::endgroup::"

    # ── Trust CA in Java truststore (if JAVA_HOME is set) ────────────
    - name: Trust CA (Java)
      if: env.PCAP_PROXY_READY == 'true'
      shell: bash
      env:
        PROXY_CA_CERT: ${{ steps.setup-dirs.outputs.ca-cert }}
      run: |
        if command -v keytool >/dev/null 2>&1 && [ -n "$JAVA_HOME" ]; then
          CACERTS="$JAVA_HOME/lib/security/cacerts"
          if [ -f "$CACERTS" ]; then
            echo "Adding proxy CA to Java truststore: $CACERTS"
            if [ -w "$CACERTS" ]; then
              keytool -importcert -noprompt \
                -keystore "$CACERTS" -storepass changeit \
                -alias mitmproxy-ca \
                -file "$PROXY_CA_CERT" 2>/dev/null || true
            elif command -v sudo >/dev/null 2>&1; then
              sudo keytool -importcert -noprompt \
                -keystore "$CACERTS" -storepass changeit \
                -alias mitmproxy-ca \
                -file "$PROXY_CA_CERT" 2>/dev/null || true
            else
              echo "::warning::Cannot write Java cacerts at $CACERTS (no write permission and no sudo)"
            fi
          fi
        fi

    # ── Export proxy settings ──────────────────────────────────────────
    # All TLS traffic is MITM-intercepted. The proxy CA is trusted
    # in the OS trust store, for Node.js (NODE_EXTRA_CA_CERTS),
    # and for Java (keytool import above).
    - name: Configure proxy environment
      if: env.PCAP_PROXY_READY == 'true'
      shell: bash
      env:
        PROXY_PORT: ${{ inputs.proxy-port }}
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        PCAP_IGNORE_HOSTS: ${{ inputs.ignore-hosts }}
        PROXY_CA_CERT: ${{ steps.setup-dirs.outputs.ca-cert }}
      run: |
        PROXY_URL="http://127.0.0.1:$PROXY_PORT"

        # Convert ignore-hosts regex to no_proxy hostname list.
        # e.g. 'cloud\.nx\.app|.*\.nx\.app' → 'cloud.nx.app,.nx.app,localhost,127.0.0.1,::1'
        NO_PROXY_LIST="localhost,127.0.0.1,::1"
        if [ -n "$PCAP_IGNORE_HOSTS" ]; then
          CONVERTED=$(echo "$PCAP_IGNORE_HOSTS" \
            | tr '|' '\n' \
            | sed 's/^\.\*//' \
            | sed 's/\\././g' \
            | paste -sd, -)
          NO_PROXY_LIST="${CONVERTED},${NO_PROXY_LIST}"
          echo "no_proxy bypass list: $NO_PROXY_LIST"
        fi

        {
          echo "HTTP_PROXY=$PROXY_URL"
          echo "HTTPS_PROXY=$PROXY_URL"
          echo "http_proxy=$PROXY_URL"
          echo "https_proxy=$PROXY_URL"
          echo "NO_PROXY=$NO_PROXY_LIST"
          echo "no_proxy=$NO_PROXY_LIST"
          echo "SSLKEYLOGFILE=$CAPTURE_DIR/sslkeys.log"
          echo "NODE_EXTRA_CA_CERTS=$PROXY_CA_CERT"
        } >> "$GITHUB_ENV"
        echo "Proxy configured at $PROXY_URL (bypass: $NO_PROXY_LIST)"
