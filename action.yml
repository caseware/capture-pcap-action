name: 'Start PCAP Capture'
description: 'Starts mitmproxy + packet capture for TLS-decryptable PCAP recording. Place this step before your e2e tests.'
author: 'CaseWare'

inputs:
  proxy-port:
    description: 'Port for the mitmproxy forward proxy.'
    required: false
    default: '8080'
  capture-dir:
    description: 'Directory to store capture artifacts (PCAP, SSLKEYLOGFILE, CA cert).'
    required: false
    default: ''
  process-name:
    description: |
      Reserved for future use. Will support best-effort process-name
      filtering via iptables owner match on Linux. Currently ignored
      on all platforms.
    required: false
    default: ''
    deprecationMessage: 'Not yet implemented — reserved for a future release.'
  mitmproxy-version:
    description: 'mitmproxy version to download (standalone binary from GitHub releases).'
    required: false
    default: '11.0.2'
  filter-domains:
    description: 'Comma-separated domain allowlist for mitmproxy (glob patterns OK, e.g. "*.caseware.com,*.google.com"). Only matching traffic is kept.'
    required: false
    default: ''
  filter-exclude-domains:
    description: 'Comma-separated domain denylist (glob patterns). Matching traffic is dropped.'
    required: false
    default: ''
  filter-referers:
    description: 'Comma-separated referer patterns to keep (glob patterns).'
    required: false
    default: ''
  filter-content-types:
    description: 'Comma-separated content-type prefixes to keep (e.g. "text/html,application/json").'
    required: false
    default: ''
  filter-max-body-size:
    description: 'Max response body size in bytes. Responses larger than this are dropped from the flow file (0 = no limit).'
    required: false
    default: '0'
  raw-capture:
    description: 'Also run tcpdump (Linux) or netsh trace (Windows) for raw packet capture alongside mitmproxy. Default: false (mitmproxy only).'
    required: false
    default: 'false'
  ignore-hosts:
    description: |
      Regex of hosts to transparently tunnel without MITM interception.
      These connections pass through the proxy but are NOT TLS-intercepted,
      avoiding cert / ECONNRESET issues with CI infrastructure (NX Cloud, etc.).
      Separate multiple patterns with '|'. Uses mitmproxy --ignore-hosts.
    required: false
    default: 'cloud\.nx\.app|.*\.nx\.app|.*\.googleapis\.com|.*\.launchdarkly\.com'

outputs:
  capture-dir:
    description: 'Directory containing capture artifacts.'
    value: ${{ steps.setup-dirs.outputs.capture-dir }}
  ca-cert:
    description: 'Path to the mitmproxy root CA certificate (PEM).'
    value: ${{ steps.setup-dirs.outputs.ca-cert }}
  proxy-url:
    description: 'HTTP(S) proxy URL for clients.'
    value: ${{ steps.setup-dirs.outputs.proxy-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup directories
      id: setup-dirs
      shell: bash
      run: |
        if [ -n "${{ inputs.capture-dir }}" ]; then
          CAPTURE_DIR="${{ inputs.capture-dir }}"
        else
          CAPTURE_DIR="${RUNNER_TEMP:-/tmp}/pcap-capture"
        fi
        mkdir -p "$CAPTURE_DIR"

        MITMPROXY_HOME="$CAPTURE_DIR/.mitmproxy"
        mkdir -p "$MITMPROXY_HOME"

        echo "capture-dir=$CAPTURE_DIR"      >> "$GITHUB_OUTPUT"
        echo "mitmproxy-home=$MITMPROXY_HOME" >> "$GITHUB_OUTPUT"
        echo "ca-cert=$MITMPROXY_HOME/mitmproxy-ca-cert.pem" >> "$GITHUB_OUTPUT"
        echo "proxy-url=http://127.0.0.1:${{ inputs.proxy-port }}" >> "$GITHUB_OUTPUT"

        # Persist for the stop action
        echo "PCAP_CAPTURE_DIR=$CAPTURE_DIR"        >> "$GITHUB_ENV"
        echo "PCAP_MITMPROXY_HOME=$MITMPROXY_HOME"  >> "$GITHUB_ENV"
        echo "PCAP_PROXY_PORT=${{ inputs.proxy-port }}" >> "$GITHUB_ENV"

    # ── Install mitmproxy ──────────────────────────────────────────────
    - name: Install mitmproxy (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        MITMPROXY_VERSION: ${{ inputs.mitmproxy-version }}
      run: |
        ARCH=$(uname -m)
        INSTALL_DIR="$HOME/.local/bin"
        mkdir -p "$INSTALL_DIR"

        if [ "$ARCH" = "x86_64" ]; then
          # x86_64: use standalone binary (works on any Python version)
          echo "::group::Installing mitmproxy $MITMPROXY_VERSION (standalone binary)"
          DOWNLOAD_URL="https://downloads.mitmproxy.org/${MITMPROXY_VERSION}/mitmproxy-${MITMPROXY_VERSION}-linux-x86_64.tar.gz"
          echo "Downloading $DOWNLOAD_URL"
          curl -fsSL "$DOWNLOAD_URL" | tar -xz -C "$INSTALL_DIR" mitmdump
          chmod +x "$INSTALL_DIR/mitmdump"
        else
          # ARM64 / other: standalone binary not available, use pip
          echo "::group::Installing mitmproxy $MITMPROXY_VERSION (pip — ARM64)"
          pip install --user "mitmproxy==$MITMPROXY_VERSION"
        fi

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        export PATH="$INSTALL_DIR:$PATH"
        mitmdump --version
        echo "::endgroup::"

    - name: Install mitmproxy (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MITMPROXY_VERSION: ${{ inputs.mitmproxy-version }}
      run: |
        Write-Host "::group::Installing mitmproxy $env:MITMPROXY_VERSION (standalone binary)"
        $installDir = Join-Path $env:USERPROFILE ".local" "bin"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        $url = "https://downloads.mitmproxy.org/$env:MITMPROXY_VERSION/mitmproxy-$env:MITMPROXY_VERSION-windows-x86_64.zip"
        $zipPath = Join-Path $env:RUNNER_TEMP "mitmproxy.zip"
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
        echo $installDir >> $env:GITHUB_PATH
        $env:PATH = "$installDir;$env:PATH"
        mitmdump --version
        Write-Host "::endgroup::"

    # ── Generate CA and install it as trusted ──────────────────────────
    - name: Generate mitmproxy CA
      shell: bash
      env:
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
      run: |
        CONFDIR="$MITMPROXY_HOME"
        if [ ! -f "$CONFDIR/mitmproxy-ca-cert.pem" ]; then
          echo "Generating mitmproxy CA certificate..."
          mitmdump --set confdir="$CONFDIR" --no-server -q &
          PID=$!
          for i in $(seq 1 10); do
            if [ -f "$CONFDIR/mitmproxy-ca-cert.pem" ]; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
        fi
        if [ ! -f "$CONFDIR/mitmproxy-ca-cert.pem" ]; then
          echo "::error::CA certificate was not generated"
          exit 1
        fi
        echo "CA certificate: $CONFDIR/mitmproxy-ca-cert.pem"
        openssl x509 -in "$CONFDIR/mitmproxy-ca-cert.pem" -noout -subject -dates

    - name: Trust CA (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
      run: |
        sudo cp "$MITMPROXY_HOME/mitmproxy-ca-cert.pem" \
          /usr/local/share/ca-certificates/mitmproxy-ca.crt
        sudo update-ca-certificates

    - name: Trust CA (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
      run: |
        $certPath = Join-Path $env:MITMPROXY_HOME "mitmproxy-ca-cert.pem"
        Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\LocalMachine\Root

    # ── Start packet capture (opt-in) ──────────────────────────────────
    - name: Start tcpdump (Linux)
      if: runner.os == 'Linux' && inputs.raw-capture == 'true'
      shell: bash
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
      run: |
        echo "::group::Starting tcpdump"
        sudo bash -c "tcpdump -i any -w '$CAPTURE_DIR/raw-capture.pcap' -U tcp &
          echo \$! > '$CAPTURE_DIR/tcpdump.pid'"
        sleep 1
        echo "tcpdump PID: $(cat "$CAPTURE_DIR/tcpdump.pid")"
        echo "::endgroup::"

    - name: Start packet capture (Windows)
      if: runner.os == 'Windows' && inputs.raw-capture == 'true'
      shell: pwsh
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
      run: |
        Write-Host "::group::Starting netsh trace"
        $traceFile = Join-Path $env:CAPTURE_DIR "raw-capture.etl"
        netsh trace start capture=yes tracefile=$traceFile maxSize=512 overwrite=yes
        Write-Host "::endgroup::"

    # ── Start mitmproxy with inline filter addon ───────────────────────
    - name: Start mitmproxy (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PCAP_FILTER_DOMAINS: ${{ inputs.filter-domains }}
        PCAP_FILTER_EXCLUDE_DOMAINS: ${{ inputs.filter-exclude-domains }}
        PCAP_FILTER_REFERERS: ${{ inputs.filter-referers }}
        PCAP_FILTER_CONTENT_TYPES: ${{ inputs.filter-content-types }}
        PCAP_FILTER_MAX_BODY_SIZE: ${{ inputs.filter-max-body-size }}
        PCAP_IGNORE_HOSTS: ${{ inputs.ignore-hosts }}
      run: |
        echo "::group::Starting mitmdump on port $PROXY_PORT"
        export SSLKEYLOGFILE="$CAPTURE_DIR/sslkeys.log"

        # Resolve path to the filter addon relative to this action
        ACTION_DIR="${GITHUB_ACTION_PATH:-.}"
        ADDON_PATH="$ACTION_DIR/../scripts/filter-addon.py"
        if [ ! -f "$ADDON_PATH" ]; then
          ADDON_PATH="$(cd "$(dirname "$0")/../scripts" 2>/dev/null && pwd)/filter-addon.py"
        fi

        ADDON_FLAG=""
        if [ -f "$ADDON_PATH" ]; then
          ADDON_FLAG="--scripts $ADDON_PATH"
          echo "Filter addon: $ADDON_PATH"
        else
          echo "::warning::Filter addon not found at $ADDON_PATH"
        fi

        # Build --ignore-hosts flag for transparent tunneling of CI infra
        IGNORE_FLAG=""
        if [ -n "$PCAP_IGNORE_HOSTS" ]; then
          IGNORE_FLAG="--ignore-hosts $PCAP_IGNORE_HOSTS"
          echo "Ignore hosts (transparent tunnel): $PCAP_IGNORE_HOSTS"
        fi

        mitmdump \
          --mode regular \
          --listen-port "$PROXY_PORT" \
          --set confdir="$MITMPROXY_HOME" \
          --set ssl_insecure=true \
          --save-stream-file "$CAPTURE_DIR/mitmproxy-flows" \
          $ADDON_FLAG \
          $IGNORE_FLAG \
          --quiet \
          > "$CAPTURE_DIR/mitmdump-stdout.log" 2>&1 &
        MITM_PID=$!
        echo "$MITM_PID" > "$CAPTURE_DIR/mitmdump.pid"
        echo "mitmdump PID: $MITM_PID"

        # Wait for proxy to be ready (TCP port check).
        READY=false
        for i in $(seq 1 30); do
          if ! kill -0 "$MITM_PID" 2>/dev/null; then
            echo "::warning::mitmdump (PID $MITM_PID) exited early"
            cat "$CAPTURE_DIR/mitmdump-stdout.log" 2>/dev/null || true
            break
          fi
          if ss -tlnp 2>/dev/null | grep -q ":$PROXY_PORT "; then
            echo "mitmproxy is ready (iteration $i)"
            READY=true
            break
          fi
          sleep 1
        done
        if [ "$READY" = "true" ]; then
          echo "PCAP_PROXY_READY=true" >> "$GITHUB_ENV"
        else
          echo "::warning::mitmproxy readiness check timed out"
          cat "$CAPTURE_DIR/mitmdump-stdout.log" 2>/dev/null || true
          ps -p "$MITM_PID" -o pid,stat,time,cmd 2>/dev/null \
            || echo "Process $MITM_PID not running"
          echo "PCAP_PROXY_READY=false" >> "$GITHUB_ENV"
        fi
        echo "::endgroup::"

    - name: Start mitmproxy (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
        PROXY_PORT: ${{ inputs.proxy-port }}
        PCAP_FILTER_DOMAINS: ${{ inputs.filter-domains }}
        PCAP_FILTER_EXCLUDE_DOMAINS: ${{ inputs.filter-exclude-domains }}
        PCAP_FILTER_REFERERS: ${{ inputs.filter-referers }}
        PCAP_FILTER_CONTENT_TYPES: ${{ inputs.filter-content-types }}
        PCAP_FILTER_MAX_BODY_SIZE: ${{ inputs.filter-max-body-size }}
        PCAP_IGNORE_HOSTS: ${{ inputs.ignore-hosts }}
      run: |
        Write-Host "::group::Starting mitmdump on port $env:PROXY_PORT"
        $sslKeyLog = Join-Path $env:CAPTURE_DIR "sslkeys.log"
        $env:SSLKEYLOGFILE = $sslKeyLog

        $actionDir = $env:GITHUB_ACTION_PATH
        $addonPath = Join-Path $actionDir ".." "scripts" "filter-addon.py"

        $addonArgs = @()
        if (Test-Path $addonPath) {
          $addonArgs = @("--scripts", $addonPath)
          Write-Host "Filter addon: $addonPath"
        }

        $ignoreArgs = @()
        if ($env:PCAP_IGNORE_HOSTS) {
          $ignoreArgs = @("--ignore-hosts", $env:PCAP_IGNORE_HOSTS)
          Write-Host "Ignore hosts (transparent tunnel): $env:PCAP_IGNORE_HOSTS"
        }

        $allArgs = @(
          "--mode", "regular",
          "--listen-port", $env:PROXY_PORT,
          "--set", "confdir=$env:MITMPROXY_HOME",
          "--set", "ssl_insecure=true",
          "--save-stream-file", (Join-Path $env:CAPTURE_DIR "mitmproxy-flows"),
          "--quiet"
        ) + $addonArgs + $ignoreArgs

        $proc = Start-Process -PassThru -NoNewWindow -FilePath "mitmdump" `
          -ArgumentList $allArgs
        $proc.Id | Out-File -FilePath (Join-Path $env:CAPTURE_DIR "mitmdump.pid") -NoNewline
        Write-Host "mitmdump PID: $($proc.Id)"

        $ready = $false
        for ($i = 1; $i -le 30; $i++) {
          if ($proc.HasExited) {
            Write-Host "::warning::mitmdump exited early"
            break
          }
          $listener = Get-NetTCPConnection -LocalPort $env:PROXY_PORT `
            -State Listen -ErrorAction SilentlyContinue
          if ($listener) {
            Write-Host "mitmproxy is ready (iteration $i)"
            $ready = $true
            break
          }
          Start-Sleep -Seconds 1
        }
        if ($ready) {
          echo "PCAP_PROXY_READY=true" >> $env:GITHUB_ENV
        } else {
          Write-Host "::warning::mitmproxy readiness check timed out"
          echo "PCAP_PROXY_READY=false" >> $env:GITHUB_ENV
        }
        Write-Host "::endgroup::"

    # ── Trust CA in Java truststore (if JAVA_HOME is set) ────────────
    - name: Trust CA (Java)
      if: runner.os == 'Linux' && env.PCAP_PROXY_READY == 'true'
      shell: bash
      env:
        MITMPROXY_HOME: ${{ steps.setup-dirs.outputs.mitmproxy-home }}
      run: |
        if command -v keytool >/dev/null 2>&1 && [ -n "$JAVA_HOME" ]; then
          CACERTS="$JAVA_HOME/lib/security/cacerts"
          if [ -f "$CACERTS" ]; then
            echo "Adding mitmproxy CA to Java truststore: $CACERTS"
            sudo keytool -importcert -noprompt \
              -keystore "$CACERTS" -storepass changeit \
              -alias mitmproxy-ca \
              -file "$MITMPROXY_HOME/mitmproxy-ca-cert.pem" 2>/dev/null || true
          fi
        fi

    # ── Export proxy settings ──────────────────────────────────────────
    # All TLS traffic is MITM-intercepted. The mitmproxy CA is trusted
    # system-wide (update-ca-certificates), for Node.js (NODE_EXTRA_CA_CERTS),
    # and for Java (keytool import above).
    - name: Configure proxy environment
      if: env.PCAP_PROXY_READY == 'true'
      shell: bash
      env:
        PROXY_PORT: ${{ inputs.proxy-port }}
        CAPTURE_DIR: ${{ steps.setup-dirs.outputs.capture-dir }}
        PCAP_IGNORE_HOSTS: ${{ inputs.ignore-hosts }}
      run: |
        PROXY_URL="http://127.0.0.1:$PROXY_PORT"

        # Convert ignore-hosts regex to no_proxy hostname list.
        # e.g. 'cloud\.nx\.app|.*\.nx\.app' → 'cloud.nx.app,.nx.app,localhost,127.0.0.1,::1'
        NO_PROXY_LIST="localhost,127.0.0.1,::1"
        if [ -n "$PCAP_IGNORE_HOSTS" ]; then
          CONVERTED=$(echo "$PCAP_IGNORE_HOSTS" \
            | tr '|' '\n' \
            | sed 's/^\.\*//' \
            | sed 's/\\././g' \
            | paste -sd, -)
          NO_PROXY_LIST="${CONVERTED},${NO_PROXY_LIST}"
          echo "no_proxy bypass list: $NO_PROXY_LIST"
        fi

        {
          echo "HTTP_PROXY=$PROXY_URL"
          echo "HTTPS_PROXY=$PROXY_URL"
          echo "http_proxy=$PROXY_URL"
          echo "https_proxy=$PROXY_URL"
          echo "NO_PROXY=$NO_PROXY_LIST"
          echo "no_proxy=$NO_PROXY_LIST"
          echo "SSLKEYLOGFILE=$CAPTURE_DIR/sslkeys.log"
          echo "NODE_EXTRA_CA_CERTS=$CAPTURE_DIR/.mitmproxy/mitmproxy-ca-cert.pem"
        } >> "$GITHUB_ENV"
        echo "Proxy configured at $PROXY_URL (bypass: $NO_PROXY_LIST)"
